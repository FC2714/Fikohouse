<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FikoHouse - Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center">
    <div class="bg-gray-900 rounded-3xl p-10 w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-emerald-500">FikoHouse</h1>
            <p class="text-gray-400 mt-2">Admin Paneli</p>
        </div>

        <form method="post" action="/admin/login" class="space-y-6">
            <div>
                <label class="block text-sm text-gray-400 mb-2">Kullanıcı Adı</label>
                <input type="text" name="username" required
                       class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-5 py-4 focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">Şifre</label>
                <input type="password" name="password" required
                       class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-5 py-4 focus:outline-none focus:border-emerald-500">
            </div>
            <button type="submit"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 py-4 rounded-2xl font-semibold text-lg">
                Giriş Yap
            </button>
        </form>
    </div>
</body>
</html>
